<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Illustration only: no brand logo (Refoss is a trademark of its owner, not affiliated). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1e2b"/>
      <stop offset="1" stop-color="#173246"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2bd38f" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#2bd38f" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#2bd38f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7dee6"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9eef3"/>
      <stop offset="1" stop-color="#c3ccd6"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2bd38f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2bd38f" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="534" fill="url(#bg)"/>
  <circle cx="400" cy="230" r="250" fill="url(#halo)"/>

  <!-- A smart plug, its ring lit -->
  <g transform="translate(70 120)">
    <rect x="0" y="0" width="190" height="190" rx="46" fill="url(#plug)"/>
    <circle cx="95" cy="95" r="58" fill="#eef2f6" stroke="#c8d1da" stroke-width="3"/>
    <circle cx="70" cy="95" r="10" fill="#5b6876"/>
    <circle cx="120" cy="95" r="10" fill="#5b6876"/>
    <rect x="152" y="16" width="22" height="8" rx="4" fill="#2bd38f"/>
    <circle cx="95" cy="95" r="70" fill="none" stroke="#2bd38f" stroke-width="4" stroke-dasharray="8 10" opacity="0.6"/>
  </g>

  <!-- An energy monitor in the electrical panel, three clamps -->
  <g transform="translate(520 92)">
    <rect x="0" y="0" width="210" height="250" rx="14" fill="url(#panel)"/>
    <rect x="18" y="20" width="174" height="64" rx="8" fill="#13202e"/>
    <text x="105" y="62" font-family="DejaVu Sans Mono, monospace" font-size="30" font-weight="bold" fill="#2bd38f" text-anchor="middle">2 951 W</text>
    <g fill="#5b6876">
      <rect x="28" y="108" width="40" height="70" rx="6"/>
      <rect x="85" y="108" width="40" height="70" rx="6"/>
      <rect x="142" y="108" width="40" height="70" rx="6"/>
    </g>
    <g fill="none" stroke="#f6c453" stroke-width="5" stroke-linecap="round">
      <path d="M48 178 C 48 220, 20 230, 10 260"/>
      <path d="M105 178 C 105 225, 105 240, 105 262"/>
      <path d="M162 178 C 162 220, 190 230, 200 260"/>
    </g>
    <g fill="#2bd38f">
      <circle cx="10" cy="262" r="9"/>
      <circle cx="105" cy="264" r="9"/>
      <circle cx="200" cy="262" r="9"/>
    </g>
  </g>

  <!-- Power curve between them -->
  <path d="M290 300 L320 290 L345 296 L370 250 L395 262 L420 200 L445 228 L470 216 L495 236 L495 330 L290 330 Z" fill="url(#curve)"/>
  <path d="M290 300 L320 290 L345 296 L370 250 L395 262 L420 200 L445 228 L470 216 L495 236" fill="none" stroke="#2bd38f" stroke-width="4" stroke-linejoin="round"/>
  <path d="M392 120 L372 170 L392 170 L380 214 L420 156 L398 156 L412 120 Z" fill="#f6c453"/>

  <text x="400" y="430" font-family="DejaVu Sans, Arial, sans-serif" font-size="58" font-weight="bold" fill="#ffffff" text-anchor="middle">Refoss</text>
  <text x="400" y="478" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#a9c2d6" text-anchor="middle">plugs · relays · energy monitors · Gladys Assistant</text>
</svg>
