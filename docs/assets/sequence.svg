<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
  <title>Discovery, creation, command and state cycle of the Refoss integration (illustration)</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#46505a"/>
    </marker>
  </defs>
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="980" y="632" text-anchor="end" font-size="12" fill="#8a949e">illustration</text>
  <g font-size="15" font-weight="700" text-anchor="middle" fill="#24303c">
    <rect x="30" y="20" width="140" height="36" rx="8" fill="#eef4fb" stroke="#2979d6"/><text x="100" y="44">User</text>
    <rect x="260" y="20" width="140" height="36" rx="8" fill="#eef4fb" stroke="#2979d6"/><text x="330" y="44">Gladys</text>
    <rect x="530" y="20" width="160" height="36" rx="8" fill="#f4f6f8" stroke="#46505a"/><text x="610" y="44">Integration</text>
    <rect x="800" y="20" width="170" height="36" rx="8" fill="#f0f7f1" stroke="#2e8b57"/><text x="885" y="44">Refoss P11S</text>
  </g>
  <g stroke="#c4ccd4" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="100" y1="58" x2="100" y2="615"/>
    <line x1="330" y1="58" x2="330" y2="615"/>
    <line x1="610" y1="58" x2="610" y2="615"/>
    <line x1="885" y1="58" x2="885" y2="615"/>
  </g>
  <g font-size="13" fill="#24303c" stroke="#46505a" stroke-width="1.6">
    <line x1="100" y1="88" x2="326" y2="88" marker-end="url(#a)"/>
    <line x1="330" y1="118" x2="606" y2="118" marker-end="url(#a)"/>
    <line x1="610" y1="148" x2="334" y2="148" marker-end="url(#a)"/>
    <line x1="330" y1="178" x2="614" y2="178" marker-end="url(#a)" stroke-dasharray="5 4"/>
    <line x1="610" y1="208" x2="881" y2="208" marker-end="url(#a)"/>
    <line x1="885" y1="238" x2="614" y2="238" marker-end="url(#a)" stroke-dasharray="5 4"/>
    <line x1="610" y1="268" x2="334" y2="268" marker-end="url(#a)"/>
    <line x1="100" y1="308" x2="326" y2="308" marker-end="url(#a)"/>
    <line x1="330" y1="338" x2="606" y2="338" marker-end="url(#a)"/>
    <line x1="100" y1="388" x2="326" y2="388" marker-end="url(#a)"/>
    <line x1="330" y1="418" x2="606" y2="418" marker-end="url(#a)"/>
    <line x1="610" y1="448" x2="881" y2="448" marker-end="url(#a)"/>
    <line x1="885" y1="478" x2="614" y2="478" marker-end="url(#a)" stroke-dasharray="5 4"/>
    <line x1="610" y1="508" x2="334" y2="508" marker-end="url(#a)"/>
    <line x1="610" y1="568" x2="334" y2="568" marker-end="url(#a)"/>
  </g>
  <g font-size="12.5" fill="#24303c" text-anchor="middle">
    <text x="213" y="82">Discover tab, Scan</text>
    <text x="470" y="112">scan request</text>
    <text x="470" y="142">network scan: mDNS _http._tcp</text>
    <text x="470" y="172">instances refoss… (address, MAC)</text>
    <text x="747" y="202">ws /rpc: DeviceInfo, Config, Status</text>
    <text x="747" y="232">switch:1, kept open</text>
    <text x="470" y="262">discovered devices (one per channel)</text>
    <text x="213" y="302">Discover tab, Add</text>
    <text x="470" y="332">device created → its states</text>
    <text x="213" y="382">turns the outlet on</text>
    <text x="470" y="412">setValue(state, 1)</text>
    <text x="747" y="442">Switch.Action.Set on</text>
    <text x="747" y="472">NotifyStatus output: true</text>
    <text x="470" y="502">state 1 at once</text>
    <text x="470" y="562">power, energy index: on the refresh interval</text>
  </g>
</svg>
